<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>License – MatchCV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components/header.css">
    <link rel="stylesheet" href="/css/components/sidebar.css">
    <link rel="stylesheet" href="/css/components/topbar.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar"></div>

        <main class="main">
            <div id="header"></div>
            <div id="topbar"></div>

            <div class="content">
                <div class="section-header">
                    <div>
                        <h1 class="section-title">License & Plan</h1>
                        <p class="section-subtitle">Activate your license key and check your current quota.</p>
                    </div>
                </div>

                <div class="card">
                    <div class="mb-2">
                        <label class="small">User ID</label>
                        <input id="userId" class="input" placeholder="Enter recruiter/admin user ID">
                    </div>
                    <div class="mb-2">
                        <label class="small">License key</label>
                        <input id="key" class="input" placeholder="Enter license key">
                    </div>
                    <div class="flex mb-2">
                        <button class="btn btn-primary" id="btnActivate">Activate</button>
                        <button class="btn btn-outline" id="btnCheck">Check current plan</button>
                    </div>
                    <pre id="result" class="code-block">{ }</pre>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/main.js"></script>
    <script>
        Promise.all([
            loadPartial("#sidebar", "/partials/sidebar.html"),
            loadPartial("#header", "/partials/header.html"),
            loadPartial("#topbar", "/partials/topbar.html")
        ]).then(() => {
            setActiveNav("nav-settings");
            document.getElementById("btnActivate").addEventListener("click", activate);
            document.getElementById("btnCheck").addEventListener("click", checkPlan);
        });

        async function activate() {
            try {
                const body = {
                    key: document.getElementById("key").value.trim(),
                    userId: parseInt(document.getElementById("userId").value)
                };
                const data = await apiSend("/api/license/activate", "POST", body);
                document.getElementById("result").textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                alert("License activation failed: " + e.message);
            }
        }

        async function checkPlan() {
            try {
                const userId = parseInt(document.getElementById("userId").value);
                const data = await apiGet(`/api/license/me?userId=${userId}`);
                document.getElementById("result").textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                alert("Failed to load license info: " + e.message);
            }
        }
    </script>
</body>
</html>
