<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Create Job – MatchCV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components/header.css">
    <link rel="stylesheet" href="/css/components/sidebar.css">
    <link rel="stylesheet" href="/css/components/topbar.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar"></div>

        <main class="main">
            <div id="header"></div>
            <div id="topbar"></div>

            <div class="content">
                <div class="section-header">
                    <div>
                        <h1 class="section-title">Create Job</h1>
                        <p class="section-subtitle">Post a new job and start receiving AI-scored applicants.</p>
                    </div>
                    <button class="btn btn-outline" onclick="window.location.href='/pages/job-listings.html'">← Back</button>
                </div>

                <div class="card">
                    <div class="mb-2">
                        <label class="small">Job title *</label>
                        <input id="title" class="input" placeholder=".NET Developer">
                    </div>
                    <div class="mb-2">
                        <label class="small">Company *</label>
                        <input id="company" class="input" placeholder="Acme Inc.">
                    </div>
                    <div class="mb-2">
                        <label class="small">Job description *</label>
                        <textarea id="rawText" class="textarea" rows="5" placeholder="Describe responsibilities, requirements, and benefits..."></textarea>
                    </div>
                    <div class="small mb-2">
                        Required skills configuration can be added later via backend or a dedicated screen.
                    </div>
                    <button class="btn btn-primary" id="btnSave">Create Job</button>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/main.js"></script>
    <script>
        Promise.all([
            loadPartial("#sidebar", "/partials/sidebar.html"),
            loadPartial("#header", "/partials/header.html"),
            loadPartial("#topbar", "/partials/topbar.html")
        ]).then(() => {
            setActiveNav("nav-jobs");
            document.getElementById("btnSave").addEventListener("click", createJob);
        });

        async function createJob() {
            const body = {
                title: document.getElementById("title").value.trim(),
                company: document.getElementById("company").value.trim(),
                rawText: document.getElementById("rawText").value.trim()
            };

            if (!body.title || !body.company || !body.rawText) {
                alert("Please fill in all required fields.");
                return;
            }

            try {
                await apiSend("/api/recruiter/jobs", "POST", body);
                alert("Job created successfully.");
                window.location.href = "/pages/job-listings.html";
            } catch (e) {
                alert("Failed to create job: " + e.message);
            }
        }
    </script>
</body>
</html>
