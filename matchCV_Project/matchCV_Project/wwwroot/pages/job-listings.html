<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Job Listings – MatchCV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components/header.css">
    <link rel="stylesheet" href="/css/components/sidebar.css">
    <link rel="stylesheet" href="/css/components/topbar.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar"></div>

        <main class="main">
            <div id="header"></div>
            <div id="topbar"></div>

            <div class="content">
                <div class="section-header">
                    <div>
                        <h1 class="section-title">Job Listings</h1>
                        <p class="section-subtitle">Manage your job postings, create new jobs, and export reports.</p>
                    </div>
                    <div class="flex">
                        <button class="btn btn-primary" id="btnNewJob">+ Post New Job</button>
                        <button class="btn btn-outline" id="btnExport">Export Report</button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card mb-2">
                    <div class="flex" style="flex-wrap: wrap; gap: 8px;">
                        <input id="filterSearch" class="input" placeholder="Search jobs..." style="flex: 1; min-width: 200px;">
                        <input id="filterCompany" class="input" placeholder="Filter by company..." style="width: 180px;">
                        <button class="btn btn-outline" id="btnFilter">Filter</button>
                        <button class="btn btn-ghost" id="btnClearFilter">Clear</button>
                    </div>
                </div>

                <!-- Job Listings Table -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">All Jobs</h2>
                        <span class="small" id="jobCount">0 jobs</span>
                    </div>
                    <div class="table-wrapper">
                        <table class="table" id="jobTable">
                            <thead>
                                <tr>
                                    <th>Job Title</th>
                                    <th>Company</th>
                                    <th>Applicants</th>
                                    <th>Avg. Score</th>
                                    <th>Top Skill</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/main.js"></script>
    <script>
        Promise.all([
            loadPartial("#sidebar", "/partials/sidebar.html"),
            loadPartial("#header", "/partials/header.html"),
            loadPartial("#topbar", "/partials/topbar.html")
        ]).then(() => {
            setActiveNav("nav-jobs");
            initJobListings();
        });

        let jobs = [];

        async function initJobListings() {
            document.getElementById("btnNewJob").addEventListener("click", () => {
                window.location.href = "/pages/create-job.html";
            });
            document.getElementById("btnExport").addEventListener("click", exportReport);
            document.getElementById("btnFilter").addEventListener("click", loadJobs);
            document.getElementById("btnClearFilter").addEventListener("click", () => {
                document.getElementById("filterSearch").value = "";
                document.getElementById("filterCompany").value = "";
                loadJobs();
            });
            document.getElementById("topSearchBtn").addEventListener("click", loadJobs);

            await loadJobs();
        }

        async function loadJobs() {
            const q = document.getElementById("filterSearch").value || document.getElementById("topSearch").value || "";
            const company = document.getElementById("filterCompany").value || "";
            
            try {
                let url = `/api/recruiter/jobs?`;
                if (q) url += `q=${encodeURIComponent(q)}&`;
                if (company) url += `company=${encodeURIComponent(company)}&`;
                
                jobs = await apiGet(url);
                document.getElementById("jobCount").innerText = `${jobs.length} job${jobs.length !== 1 ? 's' : ''}`;
                renderJobs();
            } catch (e) {
                alert("Failed to load jobs: " + e.message);
            }
        }

        function renderJobs() {
            const tbody = document.querySelector("#jobTable tbody");
            tbody.innerHTML = "";

            if (!jobs || jobs.length === 0) {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td colspan="8">No jobs found.</td>`;
                tbody.appendChild(tr);
                return;
            }

            jobs.forEach(j => {
                const tr = document.createElement("tr");
                const statusClass = pickStatusClass(j);
                const statusLabel = pickStatusLabel(j);
                const createdDate = j.createdAt ? new Date(j.createdAt).toLocaleDateString() : "–";

                tr.innerHTML = `
                    <td><strong>${j.title}</strong></td>
                    <td>${j.company}</td>
                    <td>${j.applications ?? 0}</td>
                    <td><span class="pill">${j.avgScore != null ? Math.round(j.avgScore) + "%" : "–"}</span></td>
                    <td><span class="pill">${j.topSkill || "–"}</span></td>
                    <td><span class="badge ${statusClass}">${statusLabel}</span></td>
                    <td class="small">${createdDate}</td>
                    <td class="text-right">
                        <button class="btn btn-outline" style="font-size:11px;padding:4px 10px;" onclick="viewJob(${j.id})">View</button>
                        <button class="btn btn-outline" style="font-size:11px;padding:4px 10px;" onclick="editJob(${j.id})">Edit</button>
                        <button class="btn btn-outline" style="font-size:11px;padding:4px 10px;color:var(--danger);" onclick="deleteJob(${j.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function pickStatusClass(job) {
            const count = job.applications ?? 0;
            if (count === 0) return "badge-neutral";
            if (count < 5) return "badge-open";
            if (count < 15) return "badge-reviewing";
            return "badge-closed";
        }

        function pickStatusLabel(job) {
            const count = job.applications ?? 0;
            if (count === 0) return "Draft";
            if (count < 5) return "Open";
            if (count < 15) return "Reviewing";
            return "Closed";
        }

        function viewJob(id) {
            window.location.href = `/pages/job-detail.html?id=${id}`;
        }

        function editJob(id) {
            // TODO: Implement edit job page or modal
            alert("Edit job feature coming soon. Job ID: " + id);
        }

        async function deleteJob(id) {
            if (!confirm("Are you sure you want to delete this job?")) return;
            
            try {
                await apiSend(`/api/recruiter/jobs/${id}`, "DELETE");
                alert("Job deleted successfully.");
                loadJobs();
            } catch (e) {
                alert("Failed to delete job: " + e.message);
            }
        }

        async function exportReport() {
            try {
                // Tạo CSV report
                const csvRows = ["Job Title,Company,Applicants,Avg Score,Top Skill,Status,Created"];
                jobs.forEach(j => {
                    const status = pickStatusLabel(j);
                    const avgScore = j.avgScore != null ? Math.round(j.avgScore) : "N/A";
                    const created = j.createdAt ? new Date(j.createdAt).toLocaleDateString() : "N/A";
                    csvRows.push(`"${j.title}","${j.company}",${j.applications ?? 0},${avgScore},"${j.topSkill || "N/A"}","${status}","${created}"`);
                });

                const csvContent = csvRows.join("\n");
                const blob = new Blob([csvContent], { type: "text/csv" });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `jobs-report-${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (e) {
                alert("Failed to export report: " + e.message);
            }
        }
    </script>
</body>
</html>
